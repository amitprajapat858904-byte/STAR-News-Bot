name: Auto News Fetcher AI

on:
  schedule:
    - cron: '*/30 * * * *' # हर 30 मिनट में अपने आप चलेगा
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install feedparser google-generativeai

      - name: Run Fetcher Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python fetch_news.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'Auto News Bot'
          git config --global user.email 'bot@starnews.com'
          git add news_data.json
          git commit -m "Updated latest AI full news" || exit 0
          git push
