<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR News - Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; display: flex; justify-content: center; }
        .admin-box { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h2 { color: #004d40; text-align: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        textarea { height: 120px; resize: vertical; }
        button { width: 100%; background: #d32f2f; color: white; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #b71c1c; }
        #status-msg { text-align: center; margin-top: 15px; font-weight: bold; }
        #admin-content { display: none; }
    </style>
</head>
<body>

<div class="admin-box">
    <!-- Passcode Verification Screen -->
    <div id="login-box">
        <h2>🔒 Admin Login</h2>
        <div class="form-group">
            <label>एडमिन पासकोड दर्ज करें:</label>
            <input type="password" id="passcode-input" placeholder="पासवर्ड डालें (जैसे: 1234)">
        </div>
        <button onclick="verifyAdmin()">लॉगिन करें</button>
    </div>

    <!-- Main Admin Panel Area -->
    <div id="admin-content">
        <h2>📰 नई खबर पोस्ट करें</h2>
        <div class="form-group">
            <label>खबर का शीर्षक (Title):</label>
            <input type="text" id="title" placeholder="यहाँ शीर्षक लिखें...">
        </div>
        <div class="form-group">
            <label>तारीख (Date):</label>
            <input type="text" id="date" placeholder="उदा: 11 अगस्त 2026">
        </div>
        <div class="form-group">
            <label>पूरी खबर (Content):</label>
            <textarea id="content" placeholder="यहाँ पूरी खबर का विवरण लिखें..."></textarea>
        </div>
        <button onclick="postNews()">खबर पब्लिश करें 🚀</button>
        <p id="status-msg"></p>
    </div>
</div>

<script>
    // 1. अपना एडमिन पासवर्ड यहाँ सेट करें:
    const ADMIN_PASSCODE = "1234"; // इसे अपनी पसंद के पासवर्ड से बदल लें

    // 2. Firebase Database URL (आपके पिछले स्क्रीनशॉट के अनुसार):
    const FIREBASE_DB_URL = "https://starnationalinternationa-4e45b-default-rtdb.firebaseio.com/news.json";

    function verifyAdmin() {
        let inputPass = document.getElementById('passcode-input').value;
        if (inputPass === ADMIN_PASSCODE) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            // डिफ़ॉल्ट आज की तारीख भरें
            let today = new Date().toLocaleDateString('hi-IN', { day: 'numeric', month: 'long', year: 'numeric' });
            document.getElementById('date').value = today;
        } else {
            alert('गलत पासवर्ड! कृपया सही पासकोड डालें।');
        }
    }

    async function postNews() {
        let title = document.getElementById('title').value;
        let date = document.getElementById('date').value;
        let content = document.getElementById('content').value;
        let statusMsg = document.getElementById('status-msg');

        if (!title || !content) {
            alert('कृपया शीर्षक और खबर दोनों भरें!');
            return;
        }

        statusMsg.style.color = "blue";
        statusMsg.innerText = "पब्लिश हो रहा है...";

        let newPost = {
            title: title,
            date: date,
            content: content,
            timestamp: Date.now()
        };

        try {
            let response = await fetch(FIREBASE_DB_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newPost)
            });

            if (response.ok) {
                statusMsg.style.color = "green";
                statusMsg.innerText = "✅ खबर सफलतापूर्वक पोस्ट हो गई!";
                document.getElementById('title').value = '';
                document.getElementById('content').value = '';
            } else {
                throw new Error("Failed");
            }
        } catch (err) {
            statusMsg.style.color = "red";
            statusMsg.innerText = "❌ एरर! पोस्ट नहीं हो सका। Firebase Rules चेक करें।";
        }
    }
</script>

</body>
</html>
