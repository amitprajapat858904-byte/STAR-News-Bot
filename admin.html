<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - STAR CAREER 360</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; }
        .form-card { max-width: 500px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a237e; margin-top: 0; }
        label { font-weight: bold; font-size: 14px; display: block; margin-top: 12px; color: #333; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
        button { width: 100%; margin-top: 20px; background: #1a237e; color: #fff; padding: 12px; border: none; border-radius: 5px; font-weight: bold; font-size: 16px; cursor: pointer; }
        button:hover { background: #0d47a1; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="form-card">
        <h2>📢 Admin Panel</h2>
        
        <label>कैटेगरी (Category):</label>
        <select id="type">
            <option value="news">News Update</option>
            <option value="pdf">1 Lakh+ Questions & PDF</option>
            <option value="books">Books & Notes</option>
            <option value="jobs">Govt Job Alerts</option>
        </select>

        <label>शीर्षक (Title):</label>
        <input type="text" id="title" placeholder="मुख्य शीर्षक लिखें..." required>

        <label>विवरण (Details):</label>
        <textarea id="details" rows="4" placeholder="खबर/अपडेट की पूरी जानकारी लिखें..." required></textarea>

        <label>तारीख / PDF लिंक / नोट (Optional):</label>
        <input type="text" id="pdf" placeholder="तारीख (जैसे 01/08/2026) या PDF लिंक लिखें">

        <button onclick="publishData()">🚀 पब्लिश करें</button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyBBnNJxfB51ZEl7jLlJoYpk3fbhJ3tVJvM",
          authDomain: "starnationalinternationa-4e45b.firebaseapp.com",
          databaseURL: "https://starnationalinternationa-4e45b-default-rtdb.firebaseio.com",
          projectId: "starnationalinternationa-4e45b",
          storageBucket: "starnationalinternationa-4e45b.firebasestorage.app",
          messagingSenderId: "664854850863",
          appId: "1:664854850863:web:8410bed578bf3a0c0f05da",
          measurementId: "G-9HE77PYBRN"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function publishData() {
            const type = document.getElementById('type').value;
            const title = document.getElementById('title').value;
            const details = document.getElementById('details').value;
            const pdf = document.getElementById('pdf').value;

            if (!title || !details) {
                alert('कृपया Title और Details ज़रूर भरें!');
                return;
            }

            const newPostRef = db.ref('posts').push();
            newPostRef.set({
                type: type,
                title: title,
                details: details,
                pdf: pdf,
                timestamp: Date.now()
            }).then(() => {
                alert('🎉 सफलतापूर्वक पब्लिश हो गया!');
                document.getElementById('title').value = '';
                document.getElementById('details').value = '';
                document.getElementById('pdf').value = '';
            }).catch(err => {
                alert('एरर आया: ' + err.message);
            });
        }
    </script>
</body>
</html>
