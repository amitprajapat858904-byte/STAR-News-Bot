<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR News - 24x7 AI News Portal</title>
    
    <!-- Large Image Preview Tag for Discover -->
    <meta name="robots" content="index, follow, max-image-preview:large">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
            color: #333;
            top: 0 !important; /* Google Translate का टॉप बार फिक्स करने के लिए */
        }
        /* Google Translate Banner को रीडायरेक्ट करने से रोकने के लिए CSS फिक्स */
        .goog-te-banner-frame {
            display: none !important;
        }
        .goog-te-gadget {
            font-size: 14px !important;
        }
        header {
            background-color: #d32f2f;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        header h1 {
            margin: 0;
            font-size: 24px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .news-card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-left: 5px solid #d32f2f;
        }
        .news-title {
            color: #111;
            margin-top: 0;
            font-size: 20px;
            line-height: 1.4;
        }
        .news-date {
            color: #777;
            font-size: 12px;
            margin-bottom: 15px;
            display: block;
        }
        .news-content {
            font-size: 16px;
            line-height: 1.7;
            color: #444;
        }
        #loading {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>STAR News</h1>
        <!-- Google Translate Dropdown Container -->
        <div id="google_translate_element"></div>
    </header>

    <div class="container">
        <div id="news-container">
            <div id="loading">ताज़ा खबरें लोड हो रही हैं...</div>
        </div>
    </div>

    <!-- JavaScript Script -->
    <script>
        // 1. यूज़र की लोकेशन के हिसाब से ऑटो-ट्रांसलेट
        async function autoTranslateByLocation() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                const countryLangMap = { 
                    'IN': 'hi', 'US': 'en', 'ES': 'es', 
                    'FR': 'fr', 'DE': 'de', 'RU': 'ru', 
                    'CN': 'zh-CN', 'SA': 'ar' 
                };
                const userLang = countryLangMap[data.country_code] || 'en';
                
                let script = document.createElement('script');
                script.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
                document.body.appendChild(script);

                window.googleTranslateElementInit = function() {
                    new google.translate.TranslateElement({
                        pageLanguage: 'hi',
                        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
                    }, 'google_translate_element');

                    setTimeout(() => {
                        let select = document.querySelector('.goog-te-combo');
                        if (select) { 
                            select.value = userLang; 
                            select.dispatchEvent(new Event('change')); 
                        }
                    }, 1200);
                };
            } catch(e) {
                console.log("Translation Error:", e);
            }
        }

        // 2. news_data.json से ऑटो-न्यूज़ लोड करना
        function loadNewsData() {
            fetch('news_data.json')
                .then(response => response.json())
                .then(data => {
                    let container = document.getElementById('news-container');
                    container.innerHTML = ''; // Loading text हटाएँ
                    
                    data.forEach(item => {
                        // Markdown formatting हटाकर HTML Line Break लगाना
                        let formattedContent = item.content
                            .replace(/\n\n/g, '</p><p>')
                            .replace(/\n/g, '<br>')
                            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

                        container.innerHTML += `
                            <div class="news-card">
                                <h2 class="news-title">${item.title}</h2>
                                <span class="news-date">📅 ${item.date}</span>
                                <div class="news-content">
                                    <p>${formattedContent}</p>
                                </div>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    console.log("Error loading news:", err);
                    document.getElementById('news-container').innerHTML = '<p style="text-align:center;">अभी खबरें लोड करने में समस्या आ रही है। कृपया कुछ देर बाद रिफ़्रेश करें।</p>';
                });
        }

        // पेज लोड होते ही दोनों फ़ंक्शन रन करें
        document.addEventListener("DOMContentLoaded", () => {
            loadNewsData();
            autoTranslateByLocation();
        });
    </script>
</body>
</html>
