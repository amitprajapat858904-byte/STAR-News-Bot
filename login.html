<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login - STAR CAREER 360</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #1e293b; color: white; border-radius: 12px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .form-control { background: #334155; border: none; color: white; }
        .form-control:focus { background: #475569; color: white; box-shadow: none; }
        .btn-primary { background: #2563eb; border: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4">🖥️ Admin Portal</h3>
    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label">Email ID</label>
            <input type="email" id="email" class="form-control" placeholder="admin@starcareer.com" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2">लॉगिन करें 🚀</button>
    </form>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSy...",
    authDomain: "starnationalinternationa-4e45b.firebaseapp.com",
    projectId: "starnationalinternationa-4e45b",
  };
  firebase.initializeApp(firebaseConfig);

  document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;

      firebase.auth().signInWithEmailAndPassword(email, pass)
          .then(() => {
              window.location.href = "dashboard.html";
          })
          .catch(err => alert("लॉगिन एरर: " + err.message));
  });
</script>

</body>
</html>
